# =========================================================
# 🦅 Yazi Modern Keymap Configuration
# =========================================================

[mgr]
prepend_keymap = [
	# Drag and drop selected or hovered files with ripdrag
	{ on = [ "<C-d>" ], run = "plugin drag", desc = "Drag and drop files (ripdrag)" },
	{ on = [ "<C-n>" ], run = "plugin drag", desc = "Drag and drop files (ripdrag)" },

	# Interactive chmod on selected files
	{ on = [ "c", "m" ], run = "plugin chmod", desc = "Chmod on selected files" },

	# Open hovered file or directory in Neovim
	{ on = [ "e" ], run = "shell --block 'nvim %s'", desc = "Open in Neovim" },

	# Open current working directory in Neovim
	{ on = [ "E" ], run = "shell --block 'nvim .'", desc = "Open cwd in Neovim" },

	# Smart Enter: Open files or enter directory on Enter, 'l', and Right Arrow
	{ on = [ "<Enter>" ], run = "plugin smart-enter", desc = "Enter directory or open file" },
	{ on = [ "l" ], run = "plugin smart-enter", desc = "Enter directory or open file" },
	{ on = [ "<Right>" ], run = "plugin smart-enter", desc = "Enter directory or open file" },
]
