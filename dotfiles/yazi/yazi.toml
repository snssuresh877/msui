# =========================================================
# 🦅 Yazi Modern Terminal File Manager Configuration
# =========================================================

[manager]
ratio          = [ 1, 4, 3 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 5

[preview]
tab_size        = 2
max_width       = 1200
max_height      = 1000
cache_dir       = ""
image_filter    = "triangle"
image_quality   = 85
sixel_fraction  = 15
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
edit = [
    { run = '${EDITOR:-nvim} "$@"', desc = "Edit", block = true, for = "unix" },
]
open = [
    { run = 'xdg-open "$@"', desc = "Open", for = "unix" },
]
reveal = [
    { run = 'nautilus "$1"', desc = "Reveal in GUI", for = "unix" },
]

[open]
prepend_rules = [
    { mime = "text/*", use = [ "edit", "reveal" ] },
    { url = "*.json", use = [ "edit", "reveal" ] },
    { mime = "application/json", use = [ "edit", "reveal" ] },
    { mime = "*/javascript", use = [ "edit", "reveal" ] },
    { url = "*/", use = [ "edit", "open", "reveal" ] },
]

[plugin]
prepend_fetchers = [
    { url = "*", run = "git", group = "git" },
    { url = "*/", run = "git", group = "git" },
]
preloaders = [
  { mime = "image/*", run = "preview" },
]
