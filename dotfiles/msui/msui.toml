[bar]
height = 32
layer = "top"
anchor = "top"
style = "classic"
transparency = "solid"
margin_top = 6
margin_horizontal = 12
corner_radius = 14.0
border_width = 1.0
time_format = "%a %b %d  %I:%M %p"
battery_refresh_seconds = 5
sysinfo_refresh_seconds = 2
show_brand = true
show_workspaces = true
workspace_count = 3
show_active_window = true
show_media = true
show_clock = true
show_reminders_badge = false
show_network = true
show_audio = false
show_brightness = false
show_cpu = true
show_memory = true
show_storage = true
show_battery = true
show_bluetooth = false
show_wallpaper = false
show_theme = true
show_reminders_btn = false
show_screenshot = false
show_clipboard = false
show_notifications = true
show_control_center = true
show_terminal = false
show_power = true

[launcher]
width = 680
height = 420
max_results = 8
layer = "overlay"
placeholder = "Search applications..."
terminal = "kitty"
