
# ===== BASIC =====
continue=true
file-allocation=trunc
auto-file-renaming=false
summary-interval=60
log-level=notice

# ===== CONNECTION OPTIMIZATION =====
split=16
min-split-size=5M
max-connection-per-server=16
reuse-connection=true

# ===== DOWNLOAD PERFORMANCE =====
piece-length=1M

# ===== NETWORK STABILITY =====
timeout=60
connect-timeout=60
retry-wait=5
max-tries=5

# ===== DISK =====
disk-cache=64M
enable-mmap=false
