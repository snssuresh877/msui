# =============================================================================
# aria2c High-Speed Download Accelerator Configuration
# Tuned for Arch Linux / NVMe SSD (ext4) & Wayland / Hyprland
# =============================================================================

# ===== DIRECTORY & SESSION MANAGEMENT =====
dir=${HOME}/Downloads
continue=true
auto-file-renaming=true
allow-overwrite=false
always-resume=true
save-session=${HOME}/.config/aria2/session.dat
save-session-interval=60

# ===== EXT4 & NVMe SSD OPTIMIZATION =====
# falloc uses Linux kernel fallocate() for instant contiguous extent allocation
file-allocation=falloc
disk-cache=64M
enable-mmap=false

# ===== CONNECTION & MULTI-THREAD ACCELERATION =====
max-connection-per-server=16
split=16
min-split-size=1M
piece-length=1M
enable-http-keep-alive=true
enable-http-pipelining=true
optimize-concurrent-downloads=true

# ===== REAL-TIME PROGRESS & LOGGING =====
summary-interval=0
console-log-level=notice
log-level=warn

# ===== NETWORK STABILITY & ANTI-BLOCKING =====
timeout=60
connect-timeout=30
max-tries=5
retry-wait=3
max-file-not-found=2
user-agent=Mozilla/5.0 (X11; Linux x86_64; rv:130.0) Gecko/20100101 Firefox/130.0
