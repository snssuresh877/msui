icon = "tag-symbolic"
path = "tags://"

[[sidebar]]
name = "Search"
icon = "system-search-symbolic"
path = "search://"

[[sidebar]]
name = "Actions"
icon = "application-x-executable-symbolic"
path = "actions://"
[[sidebar]]
name = "Home"
