[workspace]
resolver = "3"
members = [
    "crates/msui-core",
    "crates/msui-bar",
    "crates/msui-launcher",
    "apps/msui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["m"]
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
iced = { version = "0.14", features = ["tokio", "advanced", "image", "svg"] }
iced_runtime = "0.14"
iced_exwlshell = { git = "https://github.com/waycrate/exwlshelleventloop" }
iced_wayland_subscriber = { git = "https://github.com/waycrate/exwlshelleventloop", features = ["workspace"] }
wayland-client = "0.31.15"

tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["std", "env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
chrono = "0.4"
freedesktop-desktop-entry = "0.8"
fuzzy-matcher = "0.3"
xdg = "3.0"

msui-core = { path = "crates/msui-core" }
msui-bar = { path = "crates/msui-bar" }
msui-launcher = { path = "crates/msui-launcher" }
